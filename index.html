<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ODPL – We Build Better</title>
<style>
:root{--accent:#fd5a03;--text:#ffffff;--hero1:#1b1f27;--hero2:#3a4251;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins','Segoe UI',Arial,sans-serif;background:#111;min-height:100%}
.hero{position:relative;min-height:100vh;background:linear-gradient(135deg,var(--hero1),var(--hero2) 60%,#59657a);display:flex;align-items:center;justify-content:center;color:#fff}
.hero p{opacity:.55;font-size:14px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:0 20px}
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;background:transparent;padding-top:env(safe-area-inset-top,0px);transition:background .3s,backdrop-filter .3s}
.hdr::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent);pointer-events:none}
.hdr.scrolled{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(10,12,16,.25)}
.wrap{position:relative;max-width:1300px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.logo img{display:block;height:54px;width:auto}
nav ul{list-style:none;display:flex;gap:6px;align-items:center}
nav a{display:block;color:var(--text);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;position:relative;transition:color .25s}
nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav a:hover,nav a.active{color:var(--accent)}
nav a:hover::after,nav a.active::after{transform:scaleX(1)}
.toggle{display:none;background:none;border:0;cursor:pointer;width:42px;height:42px;position:relative}
.toggle span{position:absolute;left:8px;right:8px;height:2px;background:#fff;transition:.3s}
.toggle span:nth-child(1){top:13px}.toggle span:nth-child(2){top:20px}.toggle span:nth-child(3){top:27px}
.toggle.open span:nth-child(1){top:20px;transform:rotate(45deg)}
.toggle.open span:nth-child(2){opacity:0}
.toggle.open span:nth-child(3){top:20px;transform:rotate(-45deg)}
@media(max-width:980px){
 .toggle{display:block}
 .logo img{height:44px}
 nav{position:absolute;top:100%;left:0;right:0;background:rgba(15,17,22,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-height:0;overflow:hidden;transition:max-height .35s}
 nav.open{max-height:520px}
 nav ul{flex-direction:column;align-items:stretch;gap:0;padding:8px 20px 16px}
 nav a{padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
 nav a::after{display:none}
 .wrap{padding:12px 18px}
}
</style>
</head>
